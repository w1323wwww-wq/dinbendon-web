<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司訂便當</title>
<style>
:root {
  --bg: #faf7f2; --card: #ffffff; --ink: #2b2620; --muted: #7a7166; --line: #e8e1d6;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fdeee4; --ok: #15803d; --warn: #b45309;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1714; --card: #24201c; --ink: #f1ece4; --muted: #a39a8e; --line: #3a342d;
    --accent: #fb923c; --accent-ink: #1a1714; --accent-soft: #3a2a1e; --ok: #4ade80; --warn: #fbbf24;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
.bar h1 { font-size: 17px; margin: 0 auto 0 0; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
nav a.on { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
main { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
h2 { font-size: 16px; margin: 24px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
a.card { display: block; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.big { font-size: 17px; font-weight: 600; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.ok { color: var(--ok); background: transparent; border: 1px solid var(--ok); }
.chips { position: sticky; top: 53px; z-index: 4; background: var(--bg); padding: 8px 0; display: flex; gap: 6px; overflow-x: auto; }
.chips button { white-space: nowrap; border-radius: 99px; font-size: 13px; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cat { margin-top: 18px; font-weight: 600; color: var(--muted); font-size: 13px; }
.prod { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prod .name { flex: 1 1 160px; }
.variants { display: flex; gap: 6px; flex-wrap: wrap; }
.variants button { font-size: 13px; padding: 4px 10px; position: relative; }
.variants button .n { position: absolute; top: -7px; right: -7px; background: var(--accent); color: var(--accent-ink); border-radius: 99px; font-size: 11px; min-width: 18px; padding: 0 5px; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 30px; padding: 4px 0; }
.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); }
.cartbar .bar { padding: 12px 16px; }
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: var(--card); width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px 16px; }
@media (min-width: 600px) { .sheet { align-items: center; } .sheet > div { border-radius: 16px; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.err { color: var(--accent); white-space: pre-wrap; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 20; }
.hero { text-align: center; padding: 60px 0; }
pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>🍱 公司訂便當</h1>
  <nav id="nav"></nav>
</div></header>
<main id="app"><p class="muted">載入中…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
